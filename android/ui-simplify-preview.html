<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鞋模具仓库 · 精简界面预览</title>
  <style>
    :root { --ink:#172b25; --green:#264638; --lime:#d8f267; --paper:#f7f7f0; --muted:#637469; --line:#dce2d8; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; background:#e9eee8; color:var(--ink); font-family:system-ui,"Microsoft YaHei",sans-serif; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    main { max-width:1300px; margin:auto; padding:32px 20px 56px; }
    h1 { font-size:28px; margin:0 0 8px; }
    .intro { margin:0 0 28px; color:var(--muted); line-height:1.6; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(300px,1fr)); gap:24px; align-items:start; }
    .demo { display:flex; flex-direction:column; align-items:center; gap:14px; }
    .demo h2 { align-self:stretch; font-size:18px; margin:0; text-align:center; }
    .phone { width:100%; max-width:360px; height:720px; background:#111916; border:7px solid #111916; border-radius:38px; box-shadow:0 22px 42px #172b2525; overflow:hidden; }
    .screen { height:100%; background:var(--paper); display:flex; flex-direction:column; overflow:hidden; border-radius:30px; }
    .top { flex:none; background:var(--ink); color:#fff; height:100px; padding:36px 20px 17px; display:flex; align-items:center; justify-content:space-between; }
    .top.home { height:108px; justify-content:flex-end; }
    .title { font-size:24px; font-weight:800; line-height:1; }
    .back, .gear, .torch { background:none; border:0; color:inherit; display:flex; align-items:center; justify-content:center; padding:0; }
    .back { gap:8px; font-size:22px; font-weight:800; }
    .back svg, .gear svg, .torch svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .gear { width:40px; height:40px; border:1px solid #587066; border-radius:11px; }
    .home-body { padding:23px 18px; display:grid; grid-template-rows:1fr 1fr; gap:15px; flex:1; min-height:0; }
    .home-action { border:0; border-radius:15px; text-align:left; padding:25px; display:flex; align-items:end; justify-content:space-between; font-size:36px; font-weight:850; }
    .home-action span:last-child { font-size:27px; font-weight:500; opacity:.78; }
    .home-action.issue { color:var(--ink); background:var(--lime); }
    .home-action.return { color:#fff; background:var(--green); }
    .work { flex:1; min-height:0; overflow:auto; padding:18px 17px 100px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; margin:0 1px 12px; }
    .section-head h3 { font-size:20px; margin:0; }
    .camera { height:260px; border-radius:14px; background:radial-gradient(circle at 55% 35%,#354d43,#15231d 75%); position:relative; overflow:hidden; }
    .camera::before { content:""; position:absolute; inset:33px 39px; background:linear-gradient(90deg,transparent 28%,#788e7b1f 29%,#788e7b1f 32%,transparent 33%,transparent 67%,#788e7b1f 68%,#788e7b1f 71%,transparent 72%),linear-gradient(#a5b8a322 1px,transparent 1px); background-size:100% 100%,100% 52px; filter:blur(1px); }
    .finder { position:absolute; width:58%; aspect-ratio:1; top:50%; left:50%; transform:translate(-50%,-50%); }
    .finder i { position:absolute; width:22px; height:22px; border:3px solid var(--lime); }
    .finder i:nth-child(1) { top:0; left:0; border-right:0; border-bottom:0; border-radius:6px 0 0 0; }
    .finder i:nth-child(2) { top:0; right:0; border-left:0; border-bottom:0; border-radius:0 6px 0 0; }
    .finder i:nth-child(3) { bottom:0; left:0; border-right:0; border-top:0; border-radius:0 0 0 6px; }
    .finder i:nth-child(4) { bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 6px 0; }
    .torch { position:absolute; right:13px; top:13px; width:42px; height:42px; border-radius:10px; background:#172b25c7; color:#fff; }
    .torch.on { color:var(--ink); background:var(--lime); }
    .scan-feedback { position:absolute; left:10px; right:10px; bottom:10px; display:none; align-items:center; gap:8px; padding:12px 13px; color:var(--lime); background:#172b25e8; border-radius:9px; font-size:13px; font-weight:700; }
    .scan-feedback.show { display:flex; }
    .manual { display:block; margin:10px 0 20px auto; border:0; background:none; color:var(--muted); font-size:13px; text-decoration:underline; text-underline-offset:3px; }
    .manual-row { display:none; gap:7px; margin:-10px 0 20px; }
    .manual-row.show { display:flex; }
    .manual-row input { min-width:0; flex:1; height:42px; border:1px solid var(--line); border-radius:8px; padding:0 10px; background:#fff; }
    .manual-row button { border:0; border-radius:8px; padding:0 13px; background:var(--ink); color:#fff; }
    .shelf { display:flex; align-items:center; justify-content:space-between; padding:11px 13px; margin-bottom:17px; border-radius:10px; background:#e4ebcb; font-size:14px; font-weight:750; }
    .shelf button { border:0; background:none; color:var(--green); font-size:12px; text-decoration:underline; }
    .list-title { margin:0 1px 9px; display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:800; }
    .count { color:var(--muted); font-size:13px; font-weight:700; }
    .list { min-height:85px; }
    .item { display:flex; align-items:center; gap:10px; padding:11px 12px; margin-bottom:7px; background:#fff; border:1px solid var(--line); border-radius:9px; }
    .item b { font-size:14px; }
    .item small { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    .item button { margin-left:auto; color:#8b4032; border:0; background:none; font-size:19px; line-height:1; }
    .bottom { margin-top:auto; padding:12px 17px 18px; background:var(--paper); box-shadow:0 -6px 18px #172b2510; }
    .bottom button { width:100%; height:54px; border:0; border-radius:10px; color:var(--ink); background:var(--lime); font-size:16px; font-weight:800; }
    .bottom button:disabled { background:#d8ddd2; color:#7d8a80; cursor:default; }
    .demo-control { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; min-height:39px; }
    .demo-control button { padding:8px 11px; border:1px solid #c9d7c8; border-radius:8px; background:#fff; color:var(--ink); font-size:12px; }
    .note { max-width:360px; margin:0; color:var(--muted); font-size:13px; line-height:1.5; text-align:center; }
    .changes { margin:34px auto 0; max-width:850px; background:#fff; border-radius:14px; padding:20px 23px; line-height:1.7; }
    .changes h2 { font-size:17px; margin:0 0 7px; }
    .changes p { margin:0; color:var(--muted); }
    @media(max-width:1050px) { .grid { grid-template-columns:repeat(2,minmax(300px,1fr)); } }
    @media(max-width:700px) { main { padding:20px 13px 40px; } h1 { font-size:22px; } .grid { grid-template-columns:1fr; gap:30px; } }
  </style>
</head>
<body>
  <main>
    <h1>App 界面精简预览</h1>
    <p class="intro">保留现有深绿与亮黄配色。下方按钮可模拟扫码和手电筒；所有操作只改变预览画面。</p>
    <div class="grid">
      <section class="demo">
        <h2>首页</h2>
        <div class="phone"><div class="screen">
          <header class="top home"><button class="gear" aria-label="设置" title="设置"><svg viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg></button></header>
          <div class="home-body"><button class="home-action issue" onclick="document.getElementById('issue-demo').scrollIntoView({behavior:'smooth',block:'center'})"><span>领取</span><span>→</span></button><button class="home-action return" onclick="document.getElementById('return-demo').scrollIntoView({behavior:'smooth',block:'center'})"><span>归还</span><span>→</span></button></div>
        </div></div>
        <p class="note">左上角不再显示品牌英文、提问和说明；首页只留下两个操作与设置入口。</p>
      </section>
      <section class="demo" id="issue-demo">
        <h2>领取 · 扫描模具</h2>
        <div class="phone"><div class="screen">
          <header class="top"><button class="back" aria-label="返回首页"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg><span>领取</span></button></header>
          <div class="work">
            <div class="section-head"><h3>扫描模具</h3></div>
            <div class="camera"><div class="finder"><i></i><i></i><i></i><i></i></div><button class="torch" aria-label="切换手电筒" title="手电筒"><svg viewBox="0 0 24 24"><path d="M9 3h6l-1 7 3 3v6H7v-6l3-3-1-7Zm-2 16h10v2H7z"/></svg></button><div class="scan-feedback" role="status"></div></div>
            <button class="manual" data-manual>手动输入</button><div class="manual-row"><input placeholder="模具编号" aria-label="模具编号"><button data-submit-manual>确认</button></div>
            <div class="list-title"><span>已扫模具</span><span class="count">0 件</span></div><div class="list"></div>
          </div>
          <div class="bottom"><button disabled>完成领取 · 0 件</button></div>
        </div></div>
        <div class="demo-control"><button data-demo-scan="mold">模拟扫一件模具</button><button data-demo-reset>清空预览</button></div>
        <p class="note">去掉步骤编号、常驻“扫描中”和说明句；扫码反馈只短暂出现在相机区域。</p>
      </section>
      <section class="demo" id="return-demo">
        <h2>归还 · 先库位后模具</h2>
        <div class="phone"><div class="screen">
          <header class="top"><button class="back" aria-label="返回首页"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg><span>归还</span></button></header>
          <div class="work">
            <div class="section-head"><h3>扫描库位</h3></div>
            <div class="shelf" hidden><span>库位 A-01-1</span><button data-reset-shelf>更换</button></div>
            <div class="camera"><div class="finder"><i></i><i></i><i></i><i></i></div><button class="torch" aria-label="切换手电筒" title="手电筒"><svg viewBox="0 0 24 24"><path d="M9 3h6l-1 7 3 3v6H7v-6l3-3-1-7Zm-2 16h10v2H7z"/></svg></button><div class="scan-feedback" role="status"></div></div>
            <button class="manual" data-manual>手动输入</button><div class="manual-row"><input placeholder="库位编号" aria-label="库位编号"><button data-submit-manual>确认</button></div>
            <div class="list-area" hidden><div class="list-title"><span>已扫模具</span><span class="count">0 件</span></div><div class="list"></div></div>
          </div>
          <div class="bottom"><button disabled>完成归还 · 0 件</button></div>
        </div></div>
        <div class="demo-control"><button data-demo-scan="shelf">模拟扫库位</button><button data-demo-scan="mold">模拟扫一件模具</button><button data-demo-reset>清空预览</button></div>
        <p class="note">扫库位前只显示库位相机；扫到后切为“扫描模具”，并始终显示已选库位。</p>
      </section>
    </div>
    <div class="changes"><h2>这版保留的文字</h2><p>只保留操作名、当前要扫的内容、归还库位、已扫数量与完成按钮。错误与成功反馈按需出现；设备授权等需要处理的问题仍会显示提醒。</p></div>
  </main>
  <script>
    const samples = [
      { code:'M-00128', detail:'跑鞋 A 款 · 38 码' },
      { code:'M-00136', detail:'跑鞋 A 款 · 39 码' },
      { code:'M-00152', detail:'跑鞋 B 款 · 40 码' }
    ];
    const states = new WeakMap();
    document.querySelectorAll('.demo').forEach(demo => states.set(demo, { shelf:'', items:[], timer:null }));
    function feedback(demo, message) {
      const state = states.get(demo), box = demo.querySelector('.scan-feedback');
      if (!box) return;
      clearTimeout(state.timer);
      box.textContent = '✓  ' + message;
      box.classList.add('show');
      state.timer = setTimeout(() => box.classList.remove('show'), 1500);
    }
    function render(demo) {
      const state = states.get(demo), isReturn = demo.id === 'return-demo';
      const title = demo.querySelector('.section-head h3');
      if (isReturn) {
        title.textContent = state.shelf ? '扫描模具' : '扫描库位';
        demo.querySelector('.shelf').hidden = !state.shelf;
        demo.querySelector('.shelf span').textContent = '库位 ' + state.shelf;
        demo.querySelector('.list-area').hidden = !state.shelf;
        demo.querySelector('.manual-row input').placeholder = state.shelf ? '模具编号' : '库位编号';
      }
      const list = demo.querySelector('.list');
      if (!list) return;
      list.replaceChildren();
      state.items.forEach((item, index) => {
        const row = document.createElement('div'); row.className = 'item';
        const content = document.createElement('span');
        const code = document.createElement('b'); code.textContent = item.code;
        const detail = document.createElement('small'); detail.textContent = item.detail;
        const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '×'; remove.setAttribute('aria-label', '移除 ' + item.code);
        remove.addEventListener('click', () => { state.items.splice(index, 1); render(demo); });
        content.append(code, detail); row.append(content, remove); list.append(row);
      });
      demo.querySelector('.count').textContent = state.items.length + ' 件';
      const complete = demo.querySelector('.bottom button');
      complete.textContent = `完成${isReturn ? '归还' : '领取'} · ${state.items.length} 件`;
      complete.disabled = !state.items.length || isReturn && !state.shelf;
    }
    document.addEventListener('click', event => {
      const button = event.target.closest('button'); if (!button) return;
      const demo = button.closest('.demo'); if (!demo) return;
      const state = states.get(demo), isReturn = demo.id === 'return-demo';
      if (button.classList.contains('torch')) { button.classList.toggle('on'); return; }
      if (button.hasAttribute('data-manual')) { demo.querySelector('.manual-row').classList.toggle('show'); return; }
      if (button.hasAttribute('data-reset-shelf')) { state.shelf = ''; state.items = []; render(demo); return; }
      if (button.hasAttribute('data-demo-reset')) { state.shelf = ''; state.items = []; demo.querySelector('.scan-feedback')?.classList.remove('show'); render(demo); return; }
      if (button.hasAttribute('data-demo-scan')) {
        if (isReturn && button.dataset.demoScan === 'shelf') { state.shelf = 'A-01-1'; state.items = []; feedback(demo, '库位 A-01-1'); }
        else if (isReturn && !state.shelf) { feedback(demo, '请先扫描库位'); }
        else { const item = samples[state.items.length % samples.length]; state.items.push(item); feedback(demo, item.code + ' 已加入'); }
        render(demo);
        return;
      }
      if (button.hasAttribute('data-submit-manual')) {
        const input = demo.querySelector('.manual-row input');
        if (!input.value.trim()) return;
        if (isReturn && !state.shelf) { state.shelf = input.value.trim(); feedback(demo, '库位 ' + state.shelf); }
        else { state.items.push({ code:input.value.trim(), detail:'手动输入' }); feedback(demo, input.value.trim() + ' 已加入'); }
        input.value = ''; render(demo);
      }
    });
  </script>
</body>
</html>
